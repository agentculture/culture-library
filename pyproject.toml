[project]
name = "culture-library"
version = "0.18.4"
description = "Culture's library of your own content and media: recordings, books, newspapers, articles, EPUBs, PDFs, docs and more. One catalog to ingest, index, search and serve it all, published at library.culture.dev."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.2,<2",
    "python-multipart>=0.0.9",
]
# Opt-in RAG evaluation (culture_library.eval, `culture-library eval ...`): pinned ragas plus
# the OpenAI-compatible client. Never part of base dependencies or the dev group.
# langchain-community 0.4.2 removed chat_models.vertexai, which ragas 0.4.3 imports at load.
eval = [
    "ragas==0.4.3",
    "openai>=1",
    "langchain-community<0.4.2",
]

[project.urls]
Homepage = "https://github.com/agentculture/culture-library"
Issues = "https://github.com/agentculture/culture-library/issues"

[project.scripts]
culture-library = "culture_library.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["culture_library"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "mcp>=1.2,<2",
]
# Opt-in visual parity tests (tests/visual): `uv sync --group visual`, then
# `uv run playwright install chromium` and `uv run pytest -m visual`.
visual = [
    "playwright>=1.49",
    "pillow>=10.0",
]

[tool.coverage.run]
source = ["culture_library"]
omit = ["culture_library/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=culture_library (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["culture_library"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ragas: real-ragas tests (opt-in: `uv sync --extra eval`, then `pytest -m ragas`; skipped unless ragas is installed)",
    "visual: Playwright visual-parity tests against docs/design/reference (opt-in: -m visual or CULTURE_LIBRARY_VISUAL=1)",
]
